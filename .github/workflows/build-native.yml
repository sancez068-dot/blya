name: Build native modules

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p dist/linux
          if [ -f Makefile ]; then make; fi
          cp -r build/* dist/linux/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: dist/linux

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          if (Test-Path Makefile) {
            mingw32-make
          }
          if (Test-Path build) {
            Copy-Item build/* dist/windows/ -Recurse -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: dist/windows

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p dist/macos
          if [ -f Makefile ]; then make; fi
          cp -r build/* dist/macos/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: dist/macos
